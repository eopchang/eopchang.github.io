<header class="site-head" data-head>
  <div class="site-head__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">
      <svg class="wordmark__glyph" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="16" rx="15" ry="4.2" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="16" cy="16" r="6.2" fill="#000" stroke="currentColor" stroke-width="1"/>
        <path d="M5.6 13.4c2.2-6.6 18.6-6.6 20.8 0" fill="none" stroke="currentColor" stroke-width=".8" opacity=".7"/>
      </svg>
      <span class="wordmark__text">NeuroAI Research Group</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
      <span class="menu-toggle__bar"></span><span class="menu-toggle__bar"></span>
      <span class="sr-only">메뉴</span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="주 메뉴">
      <ul>
        {% for item in site.data.lab.nav %}
        {% assign active = false %}
        {% if page.url contains item.url %}{% assign active = true %}{% endif %}
        {% if item.url == '/blog/' and page.layout == 'post' %}{% assign active = true %}{% endif %}
        <li><a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
