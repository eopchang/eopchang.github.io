<div class="lightbox" data-lightbox-root hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <figure class="lightbox__stage">
    <img class="lightbox__img" alt="" data-lightbox-img>
    <figcaption class="lightbox__cap" data-lightbox-cap></figcaption>
  </figure>
  <button class="lightbox__btn lightbox__close" type="button" data-lightbox-close aria-label="닫기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <button class="lightbox__btn lightbox__prev" type="button" data-lightbox-prev aria-label="이전 사진">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <button class="lightbox__btn lightbox__next" type="button" data-lightbox-next aria-label="다음 사진">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <p class="lightbox__count" data-lightbox-count aria-live="polite"></p>
</div>
