---
layout: default
page_id: post
---
<article class="post">
  <header class="post__head wrap">
    <p class="post__date"><a href="{{ '/blog/' | relative_url }}">Blog</a><span aria-hidden="true">/</span><time datetime="{{ page.date | date: '%Y-%m' }}">{{ page.date | date: '%Y년 %-m월' }}</time></p>
    <h1 class="post__title">{{ page.title }}</h1>
  </header>
  <div class="post__body wrap">
    {{ content }}
  </div>
  <nav class="post__pager wrap" aria-label="다른 글">
    {% if page.previous %}<a class="post__pager-prev" href="{{ page.previous.url | relative_url }}"><span>이전 글</span>{{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.next %}<a class="post__pager-next" href="{{ page.next.url | relative_url }}"><span>다음 글</span>{{ page.next.title }}</a>{% endif %}
  </nav>
</article>
