- id: postdoc
  kind: current
  title: Postdoctoral Researchers
  title_ko: 박사후연구원
  people:
  - name_ko: 강봉수
    name_en: Bongsu Kang
    degrees: MD(DKM), Ph.D.
    photo: /assets/img/members/bongsu-kang.webp
    bio: 강봉수 연구원은 2022년 상지대학교 한의학과 졸업 후 이론계산 Lab. 에 진학하였습니다. 자연어처리, 한의학 및 계산신경과학 분야의 교차점을 탐구하는 것을 목표로 하며, 언어 및 인지 작용에 대한 이론적 가설 제시 연구에 관심이 있습니다.
    email: ghkdtocom@gmail.com
  - name_ko: 김준동
    name_en: Jundong Kim
    degrees: MD(DKM), Ph.D.
    photo: /assets/img/members/jundong-kim.webp
    bio: 김준동 연구원은 2019년 경희대학교 한의학과를 졸업한 후, 안이비인후피부과 전문의 과정을 거쳤으며, 함께 경희대학교 임상한의학과 (안이비인후피부과교실)에서 석사 학위를 받았습니다. 이후 이론계산 lab. 박사과정에 진학하였으며, 의료 인공지능, 계산신경과학 연구에 관심을 두고 연구 중에 있습니다.
    email: kimjd@gachon.ac.kr
